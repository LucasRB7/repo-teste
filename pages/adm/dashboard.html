<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <link rel="stylesheet" href="./dashboard.css" />
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <main class="container spacer-topo">
    <div class="flex-entre spacer-topo">
      <div>
        <h1>Visão geral</h1>
        <p class="texto-suave">Resumo das contas cadastradas na plataforma.</p>
      </div>
    </div>

    <section class="grade-estatisticas spacer-topo">
      <article class="cartao-estatistica superficie cartao-sombra">
        <div class="cartao-estatistica__icone icone-azul">🧑‍💼</div>
        <div>
          <p class="texto-suave">Total de clientes</p>
          <h2 id="total-clientes">0</h2>
        </div>
      </article>
      <article class="cartao-estatistica superficie cartao-sombra">
        <div class="cartao-estatistica__icone icone-menta">🏘️</div>
        <div>
          <p class="texto-suave">Total de corretores</p>
          <h2 id="total-corretores">0</h2>
        </div>
      </article>
      <article class="cartao-estatistica superficie cartao-sombra">
        <div class="cartao-estatistica__icone icone-azul">🏠</div>
        <div>
          <p class="texto-suave">Imóveis cadastrados</p>
          <h2 id="total-imoveis">0</h2>
        </div>
      </article>
    </section>

    <section class="grade-atalhos spacer-topo">
      <a class="cartao-atalho superficie cartao-sombra" href="clientes.html">
        <h3>Gerenciar clientes</h3>
        <p class="texto-suave">Criar, editar e remover contas de clientes.</p>
        <span class="btn btn-texto">Acessar →</span>
      </a>
      <a class="cartao-atalho superficie cartao-sombra" href="corretores.html">
        <h3>Gerenciar corretores</h3>
        <p class="texto-suave">Criar, editar e remover contas de corretores.</p>
        <span class="btn btn-texto">Acessar →</span>
      </a>
    </section>
  </main>

  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/hash.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="../../assets/js/seed.js"></script>
  <script src="./dashboard.js"></script>
</body>
</html>
