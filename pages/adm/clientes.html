<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes · Administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <link rel="stylesheet" href="./clientes.css" />
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <main class="container spacer-topo">
    <div class="flex-entre spacer-topo">
      <div>
        <h1>Clientes</h1>
        <p class="texto-suave">Gerencie as contas de clientes da plataforma.</p>
      </div>
      <button class="btn btn-primario" id="btn-novo-cliente" type="button">+ Novo cliente</button>
    </div>

    <div class="tabela-wrap spacer-topo">
      <table class="tabela">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>CPF</th>
            <th>Nascimento</th>
            <th>E-mail</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela-clientes"></tbody>
      </table>
    </div>
    <p id="estado-vazio-clientes" class="estado-vazio" hidden>
      <span class="icone">🧑‍💼</span><br />Nenhum cliente cadastrado ainda.
    </p>
  </main>

  <div class="overlay" id="overlay-cliente" hidden>
    <div class="modal">
      <div class="modal__cabecalho">
        <h3 id="titulo-modal-cliente">Novo cliente</h3>
        <button class="modal__fechar" id="fechar-modal-cliente" type="button" aria-label="Fechar">✕</button>
      </div>
      <form id="form-cliente" novalidate>
        <div class="modal__corpo">
          <input type="hidden" id="cliente-id" />
          <div class="form-grupo">
            <label for="cliente-nome">Nome completo</label>
            <input class="input" id="cliente-nome" name="nome" required />
          </div>
          <div class="form-linha">
            <div class="form-grupo">
              <label for="cliente-telefone">Telefone</label>
              <input class="input" id="cliente-telefone" name="telefone" placeholder="(00) 00000-0000" required />
            </div>
            <div class="form-grupo">
              <label for="cliente-cpf">CPF</label>
              <input class="input" id="cliente-cpf" name="cpf" placeholder="000.000.000-00" required />
            </div>
          </div>
          <div class="form-linha">
            <div class="form-grupo">
              <label for="cliente-nascimento">Data de nascimento</label>
              <input class="input" type="date" id="cliente-nascimento" name="dataNascimento" required />
            </div>
            <div class="form-grupo">
              <label for="cliente-email">E-mail</label>
              <input class="input" type="email" id="cliente-email" name="email" required />
            </div>
          </div>
          <div class="form-grupo">
            <label for="cliente-senha">Senha</label>
            <input class="input" type="password" id="cliente-senha" name="senha" autocomplete="new-password" />
            <span class="campo-ajuda" id="ajuda-senha-cliente">Mínimo de 6 caracteres.</span>
          </div>
          <p id="erro-cliente" class="campo-erro" role="alert"></p>
        </div>
        <div class="modal__rodape">
          <button type="button" class="btn btn-secundario" id="cancelar-cliente">Cancelar</button>
          <button type="submit" class="btn btn-primario">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/hash.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/masks.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="../../assets/js/seed.js"></script>
  <script src="./clientes.js"></script>
</body>
</html>
