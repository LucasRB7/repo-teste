<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corretores · Administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <link rel="stylesheet" href="./corretores.css" />
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <main class="container spacer-topo">
    <div class="flex-entre spacer-topo">
      <div>
        <h1>Corretores</h1>
        <p class="texto-suave">Gerencie as contas de corretores da plataforma.</p>
      </div>
      <button class="btn btn-primario" id="btn-novo-corretor" type="button">+ Novo corretor</button>
    </div>

    <div class="tabela-wrap spacer-topo">
      <table class="tabela">
        <thead>
          <tr>
            <th>Foto</th>
            <th>Nome</th>
            <th>Telefone</th>
            <th>CPF</th>
            <th>CRECI</th>
            <th>E-mail</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela-corretores"></tbody>
      </table>
    </div>
    <p id="estado-vazio-corretores" class="estado-vazio" hidden>
      <span class="icone">🏘️</span><br />Nenhum corretor cadastrado ainda.
    </p>
  </main>

  <div class="overlay" id="overlay-corretor" hidden>
    <div class="modal">
      <div class="modal__cabecalho">
        <h3 id="titulo-modal-corretor">Novo corretor</h3>
        <button class="modal__fechar" id="fechar-modal-corretor" type="button" aria-label="Fechar">✕</button>
      </div>
      <form id="form-corretor" novalidate>
        <div class="modal__corpo">
          <input type="hidden" id="corretor-id" />

          <div class="form-grupo">
            <label for="corretor-foto">Foto</label>
            <div class="linha-foto">
              <img id="preview-foto-corretor" class="avatar" alt="Pré-visualização da foto" src="../../src/img_corretor/foto1.svg" />
              <input class="input" type="file" id="corretor-foto" accept="image/*" />
            </div>
          </div>

          <div class="form-grupo">
            <label for="corretor-nome">Nome completo</label>
            <input class="input" id="corretor-nome" name="nome" required />
          </div>
          <div class="form-linha">
            <div class="form-grupo">
              <label for="corretor-telefone">Telefone</label>
              <input class="input" id="corretor-telefone" name="telefone" placeholder="(00) 00000-0000" required />
            </div>
            <div class="form-grupo">
              <label for="corretor-cpf">CPF</label>
              <input class="input" id="corretor-cpf" name="cpf" placeholder="000.000.000-00" required />
            </div>
          </div>
          <div class="form-linha">
            <div class="form-grupo">
              <label for="corretor-nascimento">Data de nascimento</label>
              <input class="input" type="date" id="corretor-nascimento" name="dataNascimento" required />
            </div>
            <div class="form-grupo">
              <label for="corretor-creci">CRECI</label>
              <input class="input" id="corretor-creci" name="creci" placeholder="000000-UF" required />
            </div>
          </div>
          <div class="form-grupo">
            <label for="corretor-email">E-mail</label>
            <input class="input" type="email" id="corretor-email" name="email" required />
          </div>
          <div class="form-grupo">
            <label for="corretor-senha">Senha</label>
            <input class="input" type="password" id="corretor-senha" name="senha" autocomplete="new-password" />
            <span class="campo-ajuda" id="ajuda-senha-corretor">Mínimo de 6 caracteres.</span>
          </div>
          <p id="erro-corretor" class="campo-erro" role="alert"></p>
        </div>
        <div class="modal__rodape">
          <button type="button" class="btn btn-secundario" id="cancelar-corretor">Cancelar</button>
          <button type="submit" class="btn btn-primario">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/hash.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/masks.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="../../assets/js/seed.js"></script>
  <script src="./corretores.js"></script>
</body>
</html>
